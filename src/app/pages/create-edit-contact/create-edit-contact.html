<form (submit)="onSubmit($event)">
    
    <label for="nombre">Nombre:</label>
    <input type="text" [formField]="formCreateContact.nombre" id="nombre" />
    <label for="apellido">Apellido:</label>
    <input type="text" [formField]="formCreateContact.apellido" id="apellido" />
    <label for="numeroTelefono">Número de Teléfono:</label>
    <input type="tel" [formField]="formCreateContact.numeroTelefono" id="numeroTelefono" />

    <button type="submit">Crear Contacto</button>
</form>
