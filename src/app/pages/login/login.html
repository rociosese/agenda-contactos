<div class="login-container">
    <div class="login-card">
        <h1>AGENDA DE CONTACTOS</h1>
        <h2>Iniciar Sesión</h2>
        <form (submit)="login($event)">
            <div>
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" [formField]="formLogin.email">
            </div>
            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" [formField]="formLogin.password">
                <a class="forgot-password" routerLink="/forgot-password">¿Has olvidado tu contraseña?</a>
            </div>

            <button type="submit" [disabled]="formLogin().invalid()">Iniciar Sesión</button>
        </form>
        <p>¿No tienes una cuenta? <a routerLink="/register">Regístrate</a></p>
    </div>
</div>
