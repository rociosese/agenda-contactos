<a class="volver" routerLink="/contacts">← Volver</a>

<div class="details-card">

    <h1>Detalle del contacto</h1>

    <div class="contact-info">
        <p><strong>ID:</strong> {{id()}}</p>

        <h2>{{contacto()?.firstName}} {{contacto()?.lastName}}</h2>

        <p><strong>Teléfono:</strong> {{contacto()?.number}}</p>
        <p><strong>Email:</strong> {{contacto()?.email}}</p>
        <p><strong>Dirección:</strong> {{contacto()?.address}}</p>
    </div>

    <div class="actions">
        <a
            class="edit-button"
            [routerLink]="['/contacts', id(), 'edit']">
            Editar contacto
        </a>

        <button (click)="eliminarContacto(contacto()!.id)">
            Eliminar contacto
        </button>
    </div>

</div>
