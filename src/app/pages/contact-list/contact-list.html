<h1>Mis contactos</h1>
<button (click)="authService.logout()">Cerrar sesión</button>

@for (contacto of contactsService.contactList(); track $index) {

    <div class="contact-card">

        <a [routerLink]="['/contacts', contacto.id]">

            <span class="contact-image">
                <img src="img/no-image.webp" alt="Foto del contacto">
            </span>

            <span>
                <p>ID: {{contacto.id}}</p>
            </span>

            <span>
                <h2>{{contacto.firstName}} {{contacto.lastName}}</h2>
            </span>

            <span>
                <p>{{contacto.number}}</p>
            </span>

        </a>

        <div class="contact-actions">
            <a class="button" [routerLink]="['/contacts', contacto.id, 'edit']">
                Editar
            </a>

            <button (click)="eliminarContacto(contacto.id)">
                Eliminar
            </button>
        </div>

    </div>
}

<button routerLink="/contacts/create">
    Agregar contacto
</button>
